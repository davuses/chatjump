name: Publish versioned release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check version and existing release
        id: version
        run: node tools/release-plan.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - name: Build ZIP and extracted folder
        run: npm run package
      - name: Test the packaged extension in Chromium
        run: node tools/test-browser.js
        env:
          CHATJUMP_EXTENSION_ROOT: ${{ github.workspace }}/dist/chatjump-${{ needs.plan.outputs.version }}
      - name: Publish release with installation ZIP
        shell: pwsh
        run: ./tools/publish-release.ps1
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
